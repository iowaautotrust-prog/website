    <!--

      For public pages netlify/edge-functions/seo.ts replaces the title, description, Open Graph
      tags, canonical and JSON-LD below with page-specific ones.

    <title>Used Cars for Sale in Johnston, IA | Iowa Trust Motors</title>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
